<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>&#1051;&#1077;&#1090;&#1072;&#1102;&#1097;&#1072;&#1103; &#1083;&#1103;&#1075;&#1091;&#1096;&#1082;&#1072;</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #222;
    overflow: hidden;
    touch-action: none;
    font-family: Arial, sans-serif;
  }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { display: block; background: #87CEEB; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  @media (min-width: 768px) { canvas { width: 100vw; height: 100vh; } }
  @media (max-width: 767px) { canvas { width: 100vw; height: 100vh; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const W = () => canvas.width;
const H = () => canvas.height;

const TEXT = {
  coin: '\u041C\u043E\u043D\u0435\u0442\u044B: ', // Монеты
  start: '\u041D\u0430\u0447\u0430\u0442\u044C \u0438\u0433\u0440\u0443', // Начать игру
  shop: '\u041C\u0430\u0433\u0430\u0437\u0438\u043D \u0441\u043A\u0438\u043D\u043E\u0432', // Магазин скинов
  mySkins: '\u041C\u043E\u0438 \u0441\u043A\u0438\u043D\u044B', // Мои скины
  bgMenu: '\u0412\u044B\u0431\u0440\u0430\u0442\u044C \u0444\u043E\u043D', // Выбрать фон
  back: '\u041D\u0430\u0437\u0430\u0434', // Назад
  gameOver: '\u0418\u0433\u0440\u0430 \u043E\u043A\u043E\u043D\u0447\u0435\u043D\u0430', // Игра окончена
  score: '\u0421\u0447\u0435\u0442: ', // Счет
  max: '\u041C\u0430\u043A\u0441\u0438\u043C\u0443\u043C: ', // Максимум
  playAgain: '\u0418\u0433\u0440\u0430\u0442\u044C \u0441\u043D\u043E\u0432\u0430', // Играть снова
  toMenu: '\u0412 \u043C\u0435\u043D\u044E', // В меню
  bought: '\u041A\u0443\u043F\u043B\u0435\u043D\u043E', // Куплено
  select: '\u041D\u0430\u0436\u043C\u0438', // Нажми
  selected: '\u0412\u044B\u0431\u0440\u0430\u043D', // Выбран
  need: '\u041D\u0443\u0436\u043D\u043E ', // Нужно
  coinsWord: ' \u043C\u043E\u043D\u0435\u0442', // монет
  already: '\u0423\u0436\u0435 \u043A\u0443\u043F\u043B\u0435\u043D\u043E', // Уже куплено
  noCoins: '\u041D\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442 \u043C\u043E\u043D\u0435\u0442', // Не хватает монет
  buy: '\u041A\u0443\u043F\u043B\u0435\u043D\u043E: ', // Куплено: 
  rec: '\u0420\u0435\u043A\u043E\u0440\u0434: ', // Рекорд
  title: '\u041B\u0435\u0442\u0430\u044E\u0449\u0430\u044F \u043B\u044F\u0433\u0443\u0448\u043A\u0430' // Летающая лягушка
};

const BACKGROUNDS = [
  { id: 0, name: '\u041D\u0435\u0431\u043E', price: 0, color1: '#87CEEB', color2: '#B0E0E6' },
  { id: 1, name: '\u0417\u0430\u043A\u0430\u0442', price: 3, color1: '#FF7E5F', color2: '#FEB47B' },
  { id: 2, name: '\u041D\u043E\u0447\u044C', price: 5, color1: '#141E30', color2: '#243B55' },
  { id: 3, name: '\u041B\u0435\u0441', price: 7, color1: '#134E5E', color2: '#71B280' },
  { id: 4, name: '\u041F\u0443\u0441\u0442\u044B\u043D\u044F', price: 10, color1: '#D1913C', color2: '#FFD194' },
  { id: 5, name: '\u041A\u043E\u0441\u043C\u043E\u0441', price: 12, color1: '#000000', color2: '#434343' },
  { id: 6, name: '\u0420\u043E\u0437\u0430', price: 15, color1: '#FF416C', color2: '#FF4B2B' },
  { id: 7, name: '\u041E\u043A\u0435\u0430\u043D', price: 18, color1: '#2193b0', color2: '#6dd5ed' },
  { id: 8, name: '\u0418\u0437\u0443\u043C\u0440\u0443\u0434', price: 20, color1: '#11998e', color2: '#38ef7d' },
  { id: 9, name: '\u0413\u0440\u043E\u0437\u0430', price: 22, color1: '#2c3e50', color2: '#bdc3c7' },
  { id: 10, name: '\u041B\u0430\u0432\u0430\u043D\u0434\u0430', price: 25, color1: '#8E2DE2', color2: '#4A00E0' },
  { id: 11, name: '\u0417\u0438\u043C\u0430', price: 28, color1: '#E0EAFC', color2: '#CFDEF3' },
  { id: 12, name: '\u041E\u0433\u043E\u043D\u044C', price: 30, color1: '#f12711', color2: '#f5af19' },
  { id: 13, name: '\u041A\u0438\u0441\u043B\u043E\u0442\u0430', price: 32, color1: '#7F00FF', color2: '#E100FF' },
  { id: 14, name: '\u0422\u043E\u043A\u0441\u0438\u043A', price: 35, color1: '#00FF00', color2: '#003300' },
  { id: 15, name: '\u041A\u0440\u043E\u0432\u044C', price: 38, color1: '#870000', color2: '#190A05' },
  { id: 16, name: '\u0413\u043B\u0443\u0431\u0438\u043D\u0430', price: 40, color1: '#000046', color2: '#1CB5E0' },
  { id: 17, name: '\u041F\u044B\u043B\u044C', price: 45, color1: '#606c88', color2: '#3f4c6b' },
  { id: 18, name: '\u0412\u0443\u043B\u043A\u0430\u043D', price: 20, color1: '#ff4b1f', color2: '#ff9068', volcano: true },
  { id: 19, name: '\u0425\u0430\u043E\u0441', price: 50, color1: '#000000', color2: '#ff0000' }
];

const SKINS = [
  { id: 'frog', name: '\u041B\u044F\u0433\u0443\u0448\u043A\u0430', price: 0, color: '#4CAF50', dark: '#2E7D32', type: 'frog' },
  { id: 'bird', name: '\u041F\u0442\u0438\u0447\u043A\u0430', price: 3, color: '#FFC107', dark: '#FF9800', type: 'bird' },
  { id: 'eagle', name: '\u041E\u0440\u0435\u043B', price: 8, color: '#8D6E63', dark: '#5D4037', type: 'eagle' },
  { id: 'woodpecker', name: '\u0414\u044F\u0442\u0435\u043B', price: 6, color: '#F44336', dark: '#B71C1C', type: 'woodpecker' },
  { id: 'mouse', name: '\u041C\u044B\u0448\u043A\u0430', price: 5, color: '#9E9E9E', dark: '#616161', type: 'mouse' },
  { id: 'hedgehog', name: '\u0415\u0436\u0438\u043A', price: 7, color: '#795548', dark: '#4E342E', type: 'hedgehog' },
  { id: 'squirrel', name: '\u0411\u0435\u043B\u043A\u0430', price: 10, color: '#FF7043', dark: '#D84315', type: 'squirrel' },
  { id: 'bat', name: '\u041C\u044B\u0448\u044C \u043B\u0435\u0442\u0443\u0447\u0430\u044F', price: 15, color: '#424242', dark: '#212121', type: 'bat' }
];

let coins = parseInt(localStorage.getItem('frog_coins') || '0');
let maxScore = parseInt(localStorage.getItem('frog_maxScore') || '0');
let ownedSkins = JSON.parse(localStorage.getItem('frog_owned') || '["frog"]');
let currentSkin = localStorage.getItem('frog_current') || 'frog';
let currentBg = parseInt(localStorage.getItem('frog_bg') || '0');

function isBgUnlocked(bg) { return maxScore >= bg.price; }

function save() {
  localStorage.setItem('frog_coins', coins);
  localStorage.setItem('frog_maxScore', maxScore);
  localStorage.setItem('frog_owned', JSON.stringify(ownedSkins));
  localStorage.setItem('frog_current', currentSkin);
  localStorage.setItem('frog_bg', currentBg);
}

let frog = { x: 0, y: 0, w: 0, h: 0, vy: 0, gravity: 0, jump: 0 };
let pipes = [];
let score = 0;
let gameOver = false;
let started = false;
let screen = 'menu';
let animTimer = 0;
let wingFrame = 0;
let volcanoTimer = 0;

function initSizes() {
  const scale = Math.min(W() / 400, H() / 600);
  frog.w = 40 * scale;
  frog.h = 40 * scale;
  frog.x = 80 * scale;
  frog.y = H() / 2 - frog.h / 2;
  frog.gravity = 0.45 * scale;
  frog.jump = -8 * scale;
}

const GROUND = () => H() * 0.13;

function reset() {
  initSizes();
  frog.vy = 0;
  pipes = [];
  score = 0;
  gameOver = false;
  started = false;
}

function spawnPipe() {
  const scale = Math.min(W() / 400, H() / 600);
  const gap = 160 * scale;
  const minTop = 60 * scale;
  const maxTop = H() - GROUND() - gap - 60 * scale;
  const top = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: W(), top: top, gap: gap, w: 60 * scale, passed: false });
}

let pipeTimer = 0;

function drawAnimal(skin, cx, cy, scale, frame) {
  const c = skin.color;
  const d = skin.dark;
  ctx.save();
  ctx.translate(cx, cy);
  const legOffset = frame === 0 ? -8 : 8;

  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.ellipse(0, 0, 22 * scale, 18 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = d;
  ctx.beginPath();
  ctx.ellipse(-14 * scale, (14 + legOffset) * scale, 7 * scale, 4 * scale, 0.3, 0, Math.PI * 2);
  ctx.ellipse(14 * scale, (14 - legOffset) * scale, 7 * scale, 4 * scale, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8 * scale, -10 * scale, 6 * scale, 0, Math.PI * 2);
  ctx.arc(8 * scale, -10 * scale, 6 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-8 * scale, -10 * scale, 3 * scale, 0, Math.PI * 2);
  ctx.arc(8 * scale, -10 * scale, 3 * scale, 0, Math.PI * 2);
  ctx.fill();

  if (skin.type === 'frog') {
    ctx.strokeStyle = d;
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.arc(0, 3 * scale, 9 * scale, 0.2, Math.PI - 0.2);
    ctx.stroke();
  } else if (skin.type === 'bird' || skin.type === 'eagle' || skin.type === 'woodpecker') {
    ctx.fillStyle = '#FF6F00';
    ctx.beginPath();
    ctx.moveTo(0, 2 * scale);
    ctx.lineTo(10 * scale, 6 * scale);
    ctx.lineTo(0, 10 * scale);
    ctx.closePath();
    ctx.fill();
    const wingUp = frame === 0 ? -6 : 6;
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.ellipse(-20 * scale, (0 + wingUp) * scale, 10 * scale, 5 * scale, -0.3, 0, Math.PI * 2);
    ctx.ellipse(20 * scale, (0 - wingUp) * scale, 10 * scale, 5 * scale, 0.3, 0, Math.PI * 2);
    ctx.fill();
    if (skin.type === 'woodpecker') {
      ctx.fillStyle = '#D32F2F';
      ctx.beginPath();
      ctx.arc(0, -16 * scale, 7 * scale, Math.PI, 0);
      ctx.fill();
    }
    if (skin.type === 'eagle') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -12 * scale, 10 * scale, Math.PI, 0);
      ctx.fill();
    }
  } else if (skin.type === 'mouse') {
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.arc(-12 * scale, -16 * scale, 7 * scale, 0, Math.PI * 2);
    ctx.arc(12 * scale, -16 * scale, 7 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = d;
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.moveTo(18 * scale, 4 * scale);
    ctx.quadraticCurveTo((28 + legOffset) * scale, 8 * scale, 26 * scale, 16 * scale);
    ctx.stroke();
  } else if (skin.type === 'hedgehog') {
    ctx.fillStyle = d;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 6 * scale, -14 * scale);
      ctx.lineTo(i * 6 * scale - 3 * scale, -22 * scale);
      ctx.lineTo(i * 6 * scale + 3 * scale, -22 * scale);
      ctx.closePath();
      ctx.fill();
    }
  } else if (skin.type === 'squirrel') {
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.ellipse(24 * scale, (0 + legOffset) * scale, 12 * scale, 8 * scale, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.arc(-10 * scale, -16 * scale, 5 * scale, 0, Math.PI * 2);
    ctx.arc(10 * scale, -16 * scale, 5 * scale, 0, Math.PI * 2);
    ctx.fill();
  } else if (skin.type === 'bat') {
    const wingUp = frame === 0 ? -10 : 10;
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.moveTo(-10 * scale, 0);
    ctx.lineTo(-30 * scale, (-15 + wingUp) * scale);
    ctx.lineTo(-18 * scale, 5 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10 * scale, 0);
    ctx.lineTo(30 * scale, (-15 - wingUp) * scale);
    ctx.lineTo(18 * scale, 5 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.moveTo(-8 * scale, -16 * scale);
    ctx.lineTo(-12 * scale, -24 * scale);
    ctx.lineTo(-4 * scale, -18 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8 * scale, -16 * scale);
    ctx.lineTo(12 * scale, -24 * scale);
    ctx.lineTo(4 * scale, -18 * scale);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFrog() {
  const scale = Math.min(W() / 400, H() / 600);
  animTimer++;
  if (animTimer > 6) { wingFrame = (wingFrame + 1) % 2; animTimer = 0; }
  const skin = SKINS.find(s => s.id === currentSkin) || SKINS[0];
  drawAnimal(skin, frog.x + frog.w / 2, frog.y + frog.h / 2, scale, wingFrame);
}

function drawPipes() {
  const scale = Math.min(W() / 400, H() / 600);
  for (const p of pipes) {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(p.x, 0, p.w, p.top);
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(p.x - 5 * scale, p.top - 20 * scale, p.w + 10 * scale, 20 * scale);
    const bottomY = p.top + p.gap;
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(p.x, bottomY, p.w, H() - GROUND() - bottomY);
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(p.x - 5 * scale, bottomY, p.w + 10 * scale, 20 * scale);
  }
}

function drawGround() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(0, H() - GROUND(), W(), GROUND());
  ctx.fillStyle = '#6D4C41';
  for (let i = 0; i < W(); i += 40 * scale) {
    ctx.fillRect(i, H() - GROUND(), 20 * scale, 8 * scale);
  }
}

function drawBackground() {
  const bg = BACKGROUNDS.find(b => b.id === currentBg) || BACKGROUNDS[0];
  const grad = ctx.createLinearGradient(0, 0, 0, H());
  grad.addColorStop(0, bg.color1);
  grad.addColorStop(1, bg.color2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W(), H());

  if (bg.volcano) {
    volcanoTimer += 0.05;
    ctx.fillStyle = '#3E2723';
    ctx.beginPath();
    ctx.moveTo(-50, H() - GROUND());
    ctx.lineTo(W() / 2, H() * 0.3);
    ctx.lineTo(W() + 50, H() - GROUND());
    ctx.fill();
    ctx.fillStyle = '#FF5722';
    ctx.beginPath();
    ctx.moveTo(W() / 2 - 20, H() * 0.3);
    ctx.lineTo(W() / 2 + 20, H() * 0.3);
    ctx.lineTo(W() / 2 + 40, H() - GROUND());
    ctx.lineTo(W() / 2 - 40, H() - GROUND());
    ctx.fill();
    ctx.fillStyle = '#FFC107';
    for (let i = 0; i < 15; i++) {
      let px = W() / 2 + Math.sin(volcanoTimer + i) * (50 + i * 5);
      let py = H() * 0.3 - ((volcanoTimer * 30 + i * 40) % 300);
      ctx.beginPath();
      ctx.arc(px, py, 5 + Math.random() * 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawButton(x, y, w, h, text, scale, color) {
  ctx.fillStyle = color || 'rgba(0,0,0,0.6)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2 * scale;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(16 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.textBaseline = 'alphabetic';
}

function drawHUD() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(36 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(score.toString(), W() / 2, 60 * scale);

  ctx.textAlign = 'left';
  ctx.font = 'bold ' + Math.floor(24 * scale) + 'px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText(TEXT.coin + coins, 20 * scale, 40 * scale);
}

function drawMenu() {
  const scale = Math.min(W() / 400, H() / 600);
  drawBackground();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(32 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(TEXT.title, W() / 2, H() * 0.15);

  const skin = SKINS.find(s => s.id === currentSkin) || SKINS[0];
  animTimer++;
  if (animTimer > 6) { wingFrame = (wingFrame + 1) % 2; animTimer = 0; }
  drawAnimal(skin, W() / 2, H() * 0.32, scale * 1.5, wingFrame);

  const btnW = 200 * scale;
  const btnH = 40 * scale;
  const btnX = W() / 2 - btnW / 2;

  drawButton(btnX, H() * 0.48, btnW, btnH, TEXT.start, scale, 'rgba(76,175,80,0.9)');
  drawButton(btnX, H() * 0.57, btnW, btnH, TEXT.shop, scale, 'rgba(255,152,0,0.9)');
  drawButton(btnX, H() * 0.66, btnW, btnH, TEXT.mySkins, scale, 'rgba(33,150,243,0.9)');
  drawButton(btnX, H() * 0.75, btnW, btnH, TEXT.bgMenu, scale, 'rgba(156,39,176,0.9)');

  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold ' + Math.floor(20 * scale) + 'px Arial, sans-serif';
  ctx.fillText(TEXT.coin + coins + '  |  ' + TEXT.rec + maxScore, W() / 2, H() * 0.88);
}

let shopMessage = '';
let shopMessageTimer = 0;

function drawShop() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = 'rgba(30,30,30,0.95)';
  ctx.fillRect(0, 0, W(), H());

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(28 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(TEXT.shop, W() / 2, 50 * scale);

  const cols = 2;
  const cellW = W() / (cols + 1);
  const cellH = 110 * scale;
  const startY = 110 * scale;

  SKINS.forEach((skin, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = cellW * (col + 1) - cellW / 2;
    const y = startY + row * cellH;

    const owned = ownedSkins.includes(skin.id);
    ctx.fillStyle = owned ? 'rgba(76,175,80,0.3)' : 'rgba(255,255,255,0.1)';
    ctx.fillRect(x - 70 * scale, y - 40 * scale, 140 * scale, 90 * scale);
    ctx.strokeStyle = owned ? '#4CAF50' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2 * scale;
    ctx.strokeRect(x - 70 * scale, y - 40 * scale, 140 * scale, 90 * scale);

    drawAnimal(skin, x, y - 5 * scale, scale * 0.6, wingFrame);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(14 * scale) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(skin.name, x, y + 35 * scale);

    if (owned) {
      ctx.fillStyle = '#4CAF50';
      ctx.font = 'bold ' + Math.floor(13 * scale) + 'px Arial, sans-serif';
      ctx.fillText(TEXT.bought, x, y + 50 * scale);
    } else {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold ' + Math.floor(13 * scale) + 'px Arial, sans-serif';
      ctx.fillText(skin.price + TEXT.coinsWord, x, y + 50 * scale);
    }
  });

  drawButton(W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale, TEXT.back, scale);
  if (shopMessageTimer > 0) {
    shopMessageTimer--;
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold ' + Math.floor(18 * scale) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(shopMessage, W() / 2, H() - 80 * scale);
  }
}

function drawMySkins() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = 'rgba(30,30,30,0.95)';
  ctx.fillRect(0, 0, W(), H());

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(28 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(TEXT.mySkins, W() / 2, 50 * scale);

  const cols = 2;
  const cellW = W() / (cols + 1);
  const cellH = 110 * scale;
  const startY = 110 * scale;
  const mySkins = SKINS.filter(s => ownedSkins.includes(s.id));

  mySkins.forEach((skin, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = cellW * (col + 1) - cellW / 2;
    const y = startY + row * cellH;

    const isCurrent = skin.id === currentSkin;
    ctx.fillStyle = isCurrent ? 'rgba(76,175,80,0.4)' : 'rgba(255,255,255,0.1)';
    ctx.fillRect(x - 70 * scale, y - 40 * scale, 140 * scale, 90 * scale);
    ctx.strokeStyle = isCurrent ? '#4CAF50' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2 * scale;
    ctx.strokeRect(x - 70 * scale, y - 40 * scale, 140 * scale, 90 * scale);

    drawAnimal(skin, x, y - 5 * scale, scale * 0.6, wingFrame);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(14 * scale) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(skin.name, x, y + 35 * scale);

    if (isCurrent) {
      ctx.fillStyle = '#4CAF50';
      ctx.font = 'bold ' + Math.floor(13 * scale) + 'px Arial, sans-serif';
      ctx.fillText(TEXT.selected, x, y + 50 * scale);
    } else {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold ' + Math.floor(13 * scale) + 'px Arial, sans-serif';
      ctx.fillText(TEXT.select, x, y + 50 * scale);
    }
  });

  drawButton(W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale, TEXT.back, scale);
}

function drawBackgroundsMenu() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = 'rgba(30,30,30,0.95)';
  ctx.fillRect(0, 0, W(), H());

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(24 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(TEXT.bgMenu, W() / 2, 40 * scale);
  
  ctx.font = Math.floor(16 * scale) + 'px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText(TEXT.rec + maxScore, W() / 2, 70 * scale);

  const cols = 3;
  const cellW = W() / cols;
  const cellH = 80 * scale;
  const startY = 90 * scale;

  BACKGROUNDS.forEach((bg, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = col * cellW + cellW / 2;
    const y = startY + row * cellH;

    const unlocked = isBgUnlocked(bg);
    const isCurrent = currentBg === bg.id;

    const grad = ctx.createLinearGradient(x - 40 * scale, y - 30 * scale, x + 40 * scale, y + 30 * scale);
    grad.addColorStop(0, bg.color1);
    grad.addColorStop(1, bg.color2);
    ctx.fillStyle = grad;
    ctx.fillRect(x - 45 * scale, y - 30 * scale, 90 * scale, 60 * scale);
    
    ctx.strokeStyle = isCurrent ? '#4CAF50' : (unlocked ? '#fff' : '#f44336');
    ctx.lineWidth = 3 * scale;
    ctx.strokeRect(x - 45 * scale, y - 30 * scale, 90 * scale, 60 * scale);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(12 * scale) + 'px Arial, sans-serif';
    if (unlocked) {
      ctx.fillText(bg.name, x, y + 45 * scale);
    } else {
      ctx.fillStyle = '#f44336';
      ctx.fillText(TEXT.need + bg.price, x, y + 45 * scale);
    }
  });

  drawButton(W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale, TEXT.back, scale);
}

function drawGameOver() {
  const scale = Math.min(W() / 400, H() / 600);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W(), H());
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.floor(32 * scale) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(TEXT.gameOver, W() / 2, H() / 2 - 80 * scale);
  ctx.font = Math.floor(24 * scale) + 'px Arial, sans-serif';
  ctx.fillText(TEXT.score + score, W() / 2, H() / 2 - 30 * scale);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(TEXT.max + maxScore, W() / 2, H() / 2 + 10 * scale);
  drawButton(W() / 2 - 100 * scale, H() / 2 + 50 * scale, 200 * scale, 50 * scale, TEXT.playAgain, scale, 'rgba(76,175,80,0.8)');
  drawButton(W() / 2 - 100 * scale, H() / 2 + 110 * scale, 200 * scale, 50 * scale, TEXT.toMenu, scale, 'rgba(255,152,0,0.8)');
}

function update() {
  if (screen !== 'game') return;
  if (!started || gameOver) return;

  const scale = Math.min(W() / 400, H() / 600);
  frog.vy += frog.gravity;
  frog.y += frog.vy;

  if (frog.y < 0) { frog.y = 0; frog.vy = 0; }
  if (frog.y + frog.h > H() - GROUND()) {
    gameOver = true;
    if (score > maxScore) { maxScore = score; save(); }
  }

  pipeTimer++;
  if (pipeTimer > 100) { spawnPipe(); pipeTimer = 0; }

  const speed = 3 * scale;
  for (const p of pipes) p.x -= speed;
  pipes = pipes.filter(p => p.x + p.w > -20);

  for (const p of pipes) {
    if (frog.x < p.x + p.w && frog.x + frog.w > p.x) {
      if (frog.y < p.top || frog.y + frog.h > p.top + p.gap) {
        gameOver = true;
        if (score > maxScore) { maxScore = score; save(); }
      }
    }
    if (!p.passed && p.x + p.w < frog.x) {
      p.passed = true;
      score++;
      if (score % 5 === 0) { coins++; save(); }
      if (score > maxScore) { maxScore = score; save(); }
    }
  }
}

function draw() {
  if (screen === 'game') {
    drawBackground();
    drawPipes();
    drawGround();
    drawFrog();
    drawHUD();
    if (gameOver) drawGameOver();
  } else if (screen === 'menu') {
    drawMenu();
  } else if (screen === 'shop') {
    drawShop();
  } else if (screen === 'myskins') {
    drawMySkins();
  } else if (screen === 'backgrounds') {
    drawBackgroundsMenu();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function getClickPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function isInside(x, y, bx, by, bw, bh) {
  return x > bx && x < bx + bw && y > by && y < by + bh;
}

function handleClick(x, y) {
  const scale = Math.min(W() / 400, H() / 600);

  if (screen === 'menu') {
    const btnW = 200 * scale;
    const btnH = 40 * scale;
    const btnX = W() / 2 - btnW / 2;

    if (isInside(x, y, btnX, H() * 0.48, btnW, btnH)) { reset(); screen = 'game'; return; }
    if (isInside(x, y, btnX, H() * 0.57, btnW, btnH)) { screen = 'shop'; return; }
    if (isInside(x, y, btnX, H() * 0.66, btnW, btnH)) { screen = 'myskins'; return; }
    if (isInside(x, y, btnX, H() * 0.75, btnW, btnH)) { screen = 'backgrounds'; return; }
  } else if (screen === 'game') {
    if (gameOver) {
      const btnW = 200 * scale;
      const btnH = 50 * scale;
      const btnX = W() / 2 - btnW / 2;
      if (isInside(x, y, btnX, H() / 2 + 50 * scale, btnW, btnH)) { reset(); started = true; return; }
      if (isInside(x, y, btnX, H() / 2 + 110 * scale, btnW, btnH)) { screen = 'menu'; return; }
      return;
    }
    if (!started) { started = true; return; }
    frog.vy = frog.jump;
  } else if (screen === 'shop') {
    if (isInside(x, y, W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale)) { screen = 'menu'; return; }
    const cols = 2;
    const cellW = W() / (cols + 1);
    const cellH = 110 * scale;
    const startY = 110 * scale;

    SKINS.forEach((skin, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = cellW * (col + 1) - cellW / 2;
      const cy = startY + row * cellH;
      if (isInside(x, y, cx - 70 * scale, cy - 40 * scale, 140 * scale, 90 * scale)) {
        if (ownedSkins.includes(skin.id)) { shopMessage = TEXT.already; shopMessageTimer = 60; return; }
        if (coins >= skin.price) {
          coins -= skin.price; ownedSkins.push(skin.id); shopMessage = TEXT.buy + skin.name; shopMessageTimer = 60; save();
        } else { shopMessage = TEXT.noCoins; shopMessageTimer = 60; }
      }
    });
  } else if (screen === 'myskins') {
    if (isInside(x, y, W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale)) { screen = 'menu'; return; }
    const cols = 2;
    const cellW = W() / (cols + 1);
    const cellH = 110 * scale;
    const startY = 110 * scale;
    const mySkins = SKINS.filter(s => ownedSkins.includes(s.id));

    mySkins.forEach((skin, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = cellW * (col + 1) - cellW / 2;
      const cy = startY + row * cellH;
      if (isInside(x, y, cx - 70 * scale, cy - 40 * scale, 140 * scale, 90 * scale)) {
        currentSkin = skin.id; save();
      }
    });
  } else if (screen === 'backgrounds') {
    if (isInside(x, y, W() / 2 - 80 * scale, H() - 60 * scale, 160 * scale, 40 * scale)) { screen = 'menu'; return; }
    const cols = 3;
    const cellW = W() / cols;
    const cellH = 80 * scale;
    const startY = 90 * scale;

    BACKGROUNDS.forEach((bg, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = col * cellW + cellW / 2;
      const cy = startY + row * cellH;
      if (isInside(x, y, cx - 45 * scale, cy - 30 * scale, 90 * scale, 60 * scale)) {
        if (isBgUnlocked(bg)) {
          currentBg = bg.id;
          save();
        }
      }
    });
  }
}

canvas.addEventListener('mousedown', e => {
  const pos = getClickPos(e); handleClick(pos.x, pos.y);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const pos = getClickPos(e); handleClick(pos.x, pos.y);
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && screen === 'game' && !gameOver) {
    e.preventDefault();
    if (!started) { started = true; return; }
    frog.vy = frog.jump;
  }
});

initSizes();
loop();
</script>
</body>
</html>
